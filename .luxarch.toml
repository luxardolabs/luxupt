[[target]]
kind = "fastapi-web"
app = "app"
# HTMX/template surface only -- every router returns a TemplateResponse; there are no
# JSON/mobile endpoints, so there is no app/api/v*/routers tree to scan. Attested so the
# "no JSON-API routers scanned" note does not read as a hollow green (LUXHELIX-100).
web_only = true

[enums]
declared = [
  "ActivityType", "CaptureMethod", "CaptureStatus",
  "JobStatus", "JobType", "ScheduleSource", "TimelapseStatus",
]

[allowlist]
# The ONE genuinely-public mutating route (fw.mutating_route_authenticated): first-run
# bootstrap, the same class as login/register that the rule names. It cannot require auth
# because no user exists yet, and it CLOSES ITSELF -- setup_router.py:56 re-checks
# needs_setup(db) inside the handler (race protection) and redirects to /login the moment any
# user exists. Per-site evidence, not a blanket deferral: the rule stays live everywhere else.
auth_public = [
  { function = "create_first_user", evidence = "first-run setup; no user exists yet to authenticate as, and the handler re-checks needs_setup() and redirects to /login once one does (setup_router.py:56)" },
]

# Vendor pass-through fields (ADR-001 "external identifier" case): these values come
# verbatim from the UniFi Protect API (camera_data["state"|"videoMode"|"hdrType"]) —
# Ubiquiti controls the set and can extend it in any firmware release; the app only
# stores and displays them, never branches on members beyond state == "CONNECTED".
enum_freetext_columns = [
  { path = "app/models/camera_model.py", column = "state", evidence = "Protect API camera state, vendor-defined set (only CONNECTED is tested; unknown states must not be rejected)" },
  { path = "app/models/camera_model.py", column = "video_mode", evidence = "Protect API videoMode, vendor-defined set, stored/displayed only" },
  { path = "app/models/camera_model.py", column = "hdr_type", evidence = "Protect API hdrType, vendor-defined set, stored/displayed only" },
]
enum_dto_freetext = [
  { path = "app/schemas/camera_schema.py", field = "state", evidence = "mirrors Camera.state vendor pass-through (see enum_freetext_columns)" },
  { path = "app/schemas/camera_schema.py", field = "video_mode", evidence = "mirrors Camera.video_mode vendor pass-through" },
  { path = "app/schemas/camera_schema.py", field = "hdr_type", evidence = "mirrors Camera.hdr_type vendor pass-through" },
]
# Transaction owners (fw.no_redundant_commit) — owner-declared 2026-07-16, LUXUPT-30.
# luxupt is a hybrid: alongside the FastAPI monitor it runs long-lived worker loops
# (camera fetch + timelapse render) with no request scope; each owns its sessions.
non_request_files = [
  "app/db/connection.py",                                # get_db() itself — the request-scope owner
  "app/cli.py",                                          # CLI entry: one-shot commands own their session
  "app/fetch_service.py",                                # worker loop: periodic snapshot capture
  "app/timelapse_service.py",                            # worker loop: ffmpeg render pipeline
  "app/services/core/job_core_service.py",               # JobProcessor: background job state machine
  "app/services/core/historical_fetch_core_service.py",  # background job: historical frame fetch
  "app/services/core/_fetch_settings_durable.py",        # §5e owned-session helper: commits settings so the FetchService worker (separate session) reads them; mints its own async_session
  "app/web/main.py",                                     # lifespan startup/shutdown, pre-request
  "app/services/core/backup_core_service.py",            # scheduler-driven backup loop: no request session (no self.db); prunes untracked .dump files by retention count — no DB row to orphan (side_effects_after_commit non-request case, luxarch 0.38.2)
]

# Component-macro registry (fw.component_registry, ADR-002): every PUBLIC macro in
# templates/web/macros/ must be catalogued in the showcase so the branded library stays
# discoverable and agents stop reinventing components. macros_dir defaults to <templates>/macros.
[components]
index = "partials/components"

# ─── AUDIT of inert rules (luxarch --plan §3) ──────────────────────────────────────────
# "Inert is not a pass." Every rule luxarch reports as N/A is dispositioned here: either
# turned ON below, or recorded as genuinely not-applicable with the reason. Reviewed against
# luxarch 0.125.0.

# TURNED ON ─────────────────────────────────────────────────────────────────────────────
# Every route is a state-changing HTMX form post behind SameSite=Lax; a mutating GET would be
# CSRF-reachable. There is no reason this app should have one.
[csrf]
enabled = true

# The session-ownership burn-down (fw.session_minted_in_owner) is live debt in this repo, and
# a request handler that opens a SECOND session owner while holding get_db deadlocks on the
# pool. Turn the static check on so the burn-down cannot reintroduce it.
[session]
no_nesting = true

# JWT auth: get_current_user (app/web/auth.py:229) is the single dependency that establishes
# identity, so every mutating route must carry it.
[auth]
deps = ["get_current_user"]

# The ONE genuinely-public mutating route: first-run bootstrap, the same class as
# login/register that the rule names. It cannot require auth because no user exists yet, and
# it CLOSES ITSELF -- setup_router.py:56 re-checks `needs_setup(db)` inside the handler (race
# protection) and redirects to /login the moment any user exists. Per-site evidence, not a
# blanket deferral: the rule stays live on every other mutating route.

# Templates are the display edge; data-shaping/arithmetic there belongs in the view service.
[templates]
lint_logic = true

# CONFIRMED N/A — not config-gated, structurally inapplicable ──────────────────────────
#   fw.web_routers_single_surface  — web_only = true is attested above; no JSON surface to split to.
#   fw.no_orphan_pages             — this app renders a page by a COMPUTED template name, so an
#                                    unreferenced page cannot be proven dead. Structural, not config.
#   fw.no_orphan_partials          — same computed-name reason. `--sweep orphan-templates` LISTS
#                                    candidates for review; it is explicitly NOT a clearance.
#
# CONFIRMED N/A — the feature does not exist in this app ───────────────────────────────
#   fw.tenant_scoped / fw.tenant_route_reachability — luxupt is SINGLE-TENANT (one operator, two
#     single-user deployments). There is no tenant FK to scope by; declaring one would be fiction.
#   fw.admin_endpoints_rbac        — no role tiers. Auth is one env-credential operator identity;
#                                    authorization granularity does not exist to enforce.
#   fw.feature_flag_is_not_authz / fw.feature_keys_declared — no feature-flag system.
#   fw.import_linter_declared      — layering is enforced by luxarch's AST rules, not import-linter.
#   fw.restricted_imports / fw.restricted_calls / fw.fields_wired_into_pipeline — no declared
#                                    package boundaries or field→pipeline specs in this app.
#
# DEFERRED WITH A REASON — applicable, not yet wired ──────────────────────────────────
#   fw.enum_labels        — [enums].labelled needs a display label per member; the enums are
#                           declared but unlabelled today. Wire with the enum-typing burn-down.
#   fw.color_mode_tokens  — needs a [color_tokens] token→tailwind map; the palette is defined in
#                           tailwind.config.js and has not been mapped yet.

# ── route-smoke ──────────────────────────────────────────────────────────────────────
# Every registered route is REQUESTED by the suite, so `filterwarnings = error` actually
# runs everywhere it matters, and so a render-time 500 cannot ship. Not optional for this
# app: it runs StrictUndefined, where an unguarded template deref RAISES, and rendering the
# route is the only net that sees it (luxarch 0.191.0). Turning it on found nine live 500s
# and one dependency deprecation that was one release away from breaking password hashing.
# The asserter is the emitted tests/conftest_route_smoke.py — re-emit, never hand-edit.
[route_smoke]
enabled = true
exempt = [
  "/health/live",   # liveness probe — no behaviour to assert
  "/health/ready",  # readiness probe — no behaviour to assert
  "/metrics",       # prometheus scrape — no behaviour to assert
]
