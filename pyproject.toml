[tool.poetry]
name = "luxupt"
# This repo is an APPLICATION, not a distributable package: every install is
# `poetry install --no-root` and the artifact is the docker image, not a wheel.
# package-mode = false lets the version live ONLY in the VERSION file — in package
# mode poetry demands a version literal here, the exact drift repo.version_single_source
# stops. The version is read from VERSION by [tool.hatch.version] below.
package-mode = false
description = "LuxUPT - Time-lapse videos from UniFi Protect cameras"
authors = ["Luxardo Labs <info@luxardolabs.com>"]
license = "AGPL-3.0-only"
readme = "README.md"
homepage = "https://github.com/luxardolabs/luxupt"
repository = "https://github.com/luxardolabs/luxupt"
documentation = "https://github.com/luxardolabs/luxupt#readme"
keywords = ["unifi", "protect", "timelapse", "video", "surveillance", "luxupt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Monitoring"
]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.14"
httpx = "^0.28.1"
urllib3 = "^2.6.3"
fastapi = "^0.140.0"  # >=0.140 admits starlette 1.x (fixes the starlette CVEs; ^0.128 capped it <1.0)
uvicorn = {version = "^0.40.0", extras = ["standard"]}
jinja2 = "^3.1.6"
python-multipart = ">=0.0.31,<0.1.0"  # 0.0.31 clears the multipart DoS CVEs (^0.0.22 pinned it exactly)
pyjwt = "^2.10.1"  # replaces unmaintained python-jose (dropped cryptography-PKCS7 CVE + ecdsa dep); HS256 uses stdlib hmac
# Password hashing. argon2-cffi is imported DIRECTLY (app/utils/password_hash.py), declared
# rather than relied on as someone else's extra — an undeclared transitive import breaks the
# day the provider drops it (luxaudit --doc DEPENDENCY-DECLARATION, DEP003). passlib is gone:
# unmaintained since 2020, and its argon2 handler reads an argon2-cffi attribute being removed.
argon2-cffi = "^25.1.0"
aiofiles = "^25.1.0"
pillow = "^12.1.0"
sqlalchemy = {version = "^2.0.46", extras = ["asyncio"]}
aiosqlite = "^0.22.1"
alembic = "^1.14.0"
python-json-logger = "^4.0.0"  # For structured JSON logging

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
black = "^26.1.0"
isort = "^7.0.0"
flake8 = "^7.3.0"
mypy = "^1.19.1"
pre-commit = "^4.5.1"
ruff = "^0.14.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version is read from the repo-root VERSION file — the one home for it
# (repo.version_single_source). Nothing else restates the number.
[project]
name = "luxupt"
dynamic = ["version"]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# black, isort, ruff, and mypy config intentionally removed — the fleet ruff (lint + format)
# and mypy standard is owned by luxlint, byte-identical in the image. See .luxlint.toml +
# `make lint` / `make format`. Carrying local ruff/mypy config is the drift luxlint kills
# (lint.no_local_ruff_config / types.no_local_mypy_config); black/isort are replaced by
# luxlint's canonical `ruff format`.

# pytest config intentionally removed — owned by luxlint (fleet test standard,
# byte-identical in the image; test.no_local_pytest_config flags a local one). `make test`
# runs the canonical config as a tail: `luxlint --emit-config pytest` then `pytest -c <it>`,
# `make test` runs pytest in Docker (Dockerfile.test) with the app package on the path. See the
# test-suite playbook: `luxlint --playbook test-suite`.

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]