[tool.poetry]
name = "luxupt"
version = "1.1.6"
description = "LuxUPT - Time-lapse videos from UniFi Protect cameras"
authors = ["Luxardo Labs <info@luxardolabs.com>"]
license = "AGPL-3.0-only"
readme = "README.md"
homepage = "https://github.com/luxardolabs/luxupt"
repository = "https://github.com/luxardolabs/luxupt"
documentation = "https://labs.luxardolabs.com/applications/luxupt/"
keywords = ["unifi", "protect", "timelapse", "video", "surveillance", "luxupt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Monitoring"
]
packages = [{include = "app", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
httpx = "^0.28.1"
urllib3 = "^2.6.3"
fastapi = "^0.140.0"  # >=0.140 admits starlette 1.x (fixes the starlette CVEs; ^0.128 capped it <1.0)
uvicorn = {version = "^0.40.0", extras = ["standard"]}
jinja2 = "^3.1.6"
python-multipart = ">=0.0.31,<0.1.0"  # 0.0.31 clears the multipart DoS CVEs (^0.0.22 pinned it exactly)
python-jose = {version = "^3.5.0", extras = ["cryptography"]}
passlib = {version = "^1.7.4", extras = ["argon2"]}
aiofiles = "^25.1.0"
pillow = "^12.1.0"
sqlalchemy = {version = "^2.0.46", extras = ["asyncio"]}
aiosqlite = "^0.22.1"
alembic = "^1.14.0"
python-json-logger = "^4.0.0"  # For structured JSON logging

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
black = "^26.1.0"
isort = "^7.0.0"
flake8 = "^7.3.0"
mypy = "^1.19.1"
pre-commit = "^4.5.1"
ruff = "^0.14.14"

[tool.poetry.scripts]
luxupt = "app.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# black, isort, ruff, and mypy config intentionally removed — the fleet ruff (lint + format)
# and mypy standard is owned by luxlint, byte-identical in the image. See .luxlint.toml +
# `make lint` / `make format`. Carrying local ruff/mypy config is the drift luxlint kills
# (lint.no_local_ruff_config / types.no_local_mypy_config); black/isort are replaced by
# luxlint's canonical `ruff format`.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/app"]   # flat-import root: tests import `web.main`, `db.connection`, … (no app/ pkg)
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--verbose",
    "--cov=src/app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--asyncio-mode=auto"
]

[tool.coverage.run]
source = ["src/app"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]