# The dev host's front for every luxupt dev stack (compose service `nginx-dev`, profile `dev-edge`).
#
# The dev host's edge sends `dev-luxupt-<site>.<domain>` here over TLS on 443 at this container's
# pinned dev-edge address, with the client's Host and SNI. The site is the name's first label after
# `dev-luxupt-`, and its app is the container `luxupt-<site>` on luxupt_front, listening on 8080
# (each dev env file sets WEB_PORT=8080). A name for a site with no running app answers 502, and
# the app itself refuses a Host outside its ALLOWED_HOSTS.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's DNS: the site's app is resolved per request, so nginx starts while a site is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    log_format main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent rt=$request_time host=$host';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json
               application/javascript image/svg+xml;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # The client address comes from the edge alone, at its one fixed address on dev-edge. Any other
    # front on that network could otherwise choose it.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.30.0.2;

    # A name that is not a luxupt dev name is closed without an answer.
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        return 444;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name ~^dev-luxupt-(?<site>[a-z0-9]+)\.;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 10M;

        location / {
            set $site_upstream http://luxupt-$site:8080;
            proxy_pass $site_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
