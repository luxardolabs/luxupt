# luxlint — fleet ruff (lint + format) + mypy standard, pinned in the Makefile.
# Carries only per-repo FACTS (where to look, the runtime, deferrals) — never lint config.
# The canonical ruff.toml / mypy.ini live byte-identical in the image.

[source]
paths = ["app"]   # the app package — lint + format-check + mypy target

[python]
target = "py313"      # repo runtime FACT: python = "^3.13" (pyproject), python:3.13-slim (Dockerfile).
                      # Sets what ruff/mypy check against; the rule SET stays fleet-identical.

# Mypy ratchet (luxlint 0.22.0) — a fleet-owned, monotonic-DOWN floor for the mypy tail.
# luxupt has ZERO crash-class errors (per --playbook mypy-sweep ranking); the 227 are pure
# type-completeness — ~80 unfixable FastAPI untyped-decorator + bare dict/list type-arg (no
# bugs). The ratchet tracks + prevents regression; drain opportunistically, never raise it.
[mypy]
baseline = 227   # LUXUPT-64. `make lint` pipes mypy through `luxlint --mypy-ratchet`.

# Mypy-tail honesty attestations (luxlint --preflight). Same currency as [rules.deferred]:
# a written before→after that proves the tail resolves the real code, not phantoms.
[mypy.tail]
pydantic = "make lint tail installs pydantic + pydantic-settings; luxlint --emit-config mypy injects plugins=pydantic.mypy; without it mypy crashed at plugin load (1 error, checking aborted) → 234 honest across 47 files (LUXUPT-64)"
