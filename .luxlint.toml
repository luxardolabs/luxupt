# luxlint — fleet ruff (lint + format) + mypy standard, pinned in the Makefile.
# Carries only per-repo FACTS (where to look, the runtime, deferrals) — never lint config.
# The canonical ruff.toml / mypy.ini live byte-identical in the image.

[source]
paths = ["app"]   # the app package — lint + format-check + mypy target

[python]
target = "py313"      # repo runtime FACT: python = "^3.13" (pyproject), python:3.13-slim (Dockerfile).
                      # Sets what ruff/mypy check against; the rule SET stays fleet-identical.

# Mypy ratchet — a monotonic-DOWN floor, at ZERO. As of luxlint 0.24.0 mypy runs MOUNT-ONLY
# (`luxlint --mypy`): the fleet's typed dependency union is baked into the image, so libraries
# resolve with real types (no in-repo tail, no dev image, no pip install). 0.23.0 also disabled
# `disallow_untyped_decorators`, killing the FastAPI untyped-decorator phantom. The remaining
# genuine debt (type-arg → dict[str, Any]; Result.rowcount via app/db/dml.execute_rowcount; a
# TYPE_CHECKING id on Base) was fixed cleanly, so the honest count is 0. Ratchet stays at 0 so any
# regression goes RED; drain DOWN, never raise. LUXUPT-64 DONE.
[mypy]
baseline = 0   # luxlint --mypy applies this ratchet itself (mount-only, no piping).

# First-party app JS, wired into the canonical eslint gate. Without this block `lint.eslint`
# is INERT — it reports green having scanned nothing (luxlint lint.js_declared). `paths`
# defaults to the canonical app/static/js; vendor libs live in app/static/vendor/ and are
# not first-party. eslint runs in-image like ruff; the repo installs nothing.
[js]
source_type = "script"   # no bundler — plain <script> tags in layouts/base.html
ecma_version = "2022"
globals = ["htmx", "echarts"]   # ambient vendor libs, loaded before app.js in base.html
