# luxlint — fleet ruff (lint + format) + mypy standard, pinned in the Makefile.
# Carries only per-repo FACTS (where to look, the runtime, deferrals) — never lint config.
# The canonical ruff.toml / mypy.ini live byte-identical in the image.

[source]
paths = ["app"]   # the app package — lint + format-check + mypy target

[python]
target = "py313"      # repo runtime FACT: python = "^3.13" (pyproject), python:3.13-slim (Dockerfile).
                      # Sets what ruff/mypy check against; the rule SET stays fleet-identical.

# Mypy ratchet (luxlint 0.22.0) — a monotonic-DOWN floor, now at ZERO. The mypy tail is fully GREEN:
# the honest env (real deps) drives `mypy app` to 0 with CLEAN fixes only (no cast / no type:ignore,
# mypy-sweep §4). The type-arg debt was drained to dict[str, Any]; the SQLAlchemy Result.rowcount and
# generic ModelType.id typing gaps were fixed properly (app/db/dml.execute_rowcount; a TYPE_CHECKING
# id on Base). The ratchet stays wired at 0 so any regression goes RED. LUXUPT-64 DONE.
[mypy]
baseline = 0   # LUXUPT-64 complete — mypy tail is 0/green. `make lint` pipes through `luxlint --mypy-ratchet`.

# Mypy-tail honesty attestations (luxlint --preflight). Same currency as [rules.deferred]:
# a written before→after that proves the tail resolves the real code, not phantoms.
[mypy.tail]
pydantic = "make lint tail runs in the TEST_DEPS image (deps from poetry.lock) so pydantic + its mypy plugin load AND fastapi/sqlalchemy resolve with real types. Before: a pydantic-only lean base manufactured ~105 phantom untyped-decorator errors → 227. After (real deps, mypy-sweep §0): 122 honest across 32 files (LUXUPT-64)."
